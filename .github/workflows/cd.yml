name: cd

# Continuous delivery. Runs only on `v*` tags:
#   1. re-runs the test gate,
#   2. builds x86_64/aarch64 musl archives,
#   3. publishes the binaries plus the Jenkinsfiles and debian-scripts/main.sh to the release.

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features

  release-binaries:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cargo
            apt_pkgs: musl-tools
            rustflags: ""
            archive: targz
            exe: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: zigbuild
            apt_pkgs: ""
            rustflags: ""
            archive: targz
            exe: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain
        if: matrix.apt_pkgs != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt_pkgs }}

      - uses: mlugg/setup-zig@v2
        if: matrix.builder == 'zigbuild'
        with:
          version: 0.15.1

      - name: Install cargo-zigbuild
        if: matrix.builder == 'zigbuild'
        run: cargo install cargo-zigbuild --version 0.23.4 --locked

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          if [ "${{ matrix.builder }}" = "zigbuild" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          STAGE=dist/rs-security-checker
          mkdir -p "$STAGE/jenkins-pipeline" "$STAGE/debian-scripts"
          cp "target/${{ matrix.target }}/release/rs-security-checker${{ matrix.exe }}" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          cp jenkins-pipeline/Jenkinsfile "$STAGE/jenkins-pipeline/"
          cp jenkins-pipeline/Jenkinsfile.rust "$STAGE/jenkins-pipeline/"
          cp debian-scripts/main.sh "$STAGE/debian-scripts/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -r "../rs-security-checker-${{ matrix.target }}.zip" rs-security-checker)
          else
            tar -czf "rs-security-checker-${{ matrix.target }}.tar.gz" -C dist rs-security-checker
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rs-security-checker-${{ matrix.target }}
          path: rs-security-checker-${{ matrix.target }}.*

  publish-release:
    needs: release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # `download-artifact` writes into the workspace, so it must run after checkout.
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rs-security-checker-*.tar.gz
            rs-security-checker-*.zip
            jenkins-pipeline/Jenkinsfile
            jenkins-pipeline/Jenkinsfile.rust
            debian-scripts/main.sh
          generate_release_notes: true
