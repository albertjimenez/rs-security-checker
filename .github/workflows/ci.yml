name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  pipeline-syntax:
    name: Pipeline syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pipeline tools
        run: |
          sudo apt-get update
          sudo apt-get install -y groovy shellcheck
      - name: Bash syntax
        run: |
          bash -n debian-scripts/main.sh
          shellcheck --shell=bash --severity=error debian-scripts/main.sh
      - name: Groovy syntax (Jenkinsfiles)
        run: |
          for file in jenkins-pipeline/Jenkinsfile jenkins-pipeline/Jenkinsfile.rust; do
            echo "Parsing $file"
            groovy -e 'new GroovyShell().parse(new File(args[0]))' "$file"
          done
      - name: Shell syntax inside Jenkinsfile sh blocks
        run: python3 scripts/check-jenkins-shell-blocks.py

  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- --D warnings
      - name: Clippy (all features)
        run: cargo clippy --all-features --all-targets -- --D warnings
      - name: Unit and integration tests
        run: cargo test --all-features
      - name: Dataset check and validation
        run: |
          python3 laya-dataset/tools/build_dataset.py --check
          python3 laya-dataset/tools/validate_dataset.py
      - name: Fine-tuning preflight
        run: make -C laya-dataset finetune-check
